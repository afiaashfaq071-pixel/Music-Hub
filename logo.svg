<svg
  width="70"
  height="70"
  viewBox="0 0 512 512"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient
      id="logoGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%"
    >
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur
        stdDeviation="8"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Sound Bar -->
  <rect
    x="85"
    y="190"
    width="32"
    height="132"
    rx="16"
    fill="url(#logoGradient)"
    filter="url(#glow)"
  />

  <!-- Main M -->
  <path
    d="
      M145 322
      V190
      C145 172 158 160 175 160
      C186 160 196 166 204 176
      L256 239
      L308 176
      C316 166 326 160 337 160
      C354 160 367 172 367 190
      V322
      C367 334 357 344 345 344
      C333 344 323 334 323 322
      V218
      L276 274
      C265 287 247 287 236 274
      L189 218
      V322
      C189 334 179 344 167 344
      C155 344 145 334 145 322
      Z
    "
    fill="url(#logoGradient)"
    filter="url(#glow)"
  />

  <!-- Right Sound Bar -->
  <rect
    x="395"
    y="190"
    width="32"
    height="132"
    rx="16"
    fill="url(#logoGradient)"
    filter="url(#glow)"
  />
</svg>